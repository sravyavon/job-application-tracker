<table width="100%" border="0" cellspacing="0" cellpadding="0" style="background-color:#f4f7f3;padding:40px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <tr>
    <td align="center">
      <table width="480" border="0" cellspacing="0" cellpadding="0" style="background-color:#ffffff;border-radius:16px;border:1px solid #e2e8e0;overflow:hidden">
        <!-- Header -->
        <tr>
          <td style="padding:32px 32px 24px;text-align:center">
            <img src="https://herontrack.vercel.app/apple-icon.png" alt="Herontrack" width="40" height="40" style="display:inline-block;width:40px;height:40px;border-radius:10px" />
            <h1 style="margin:12px 0 0;font-size:20px;font-weight:600;color:#2a3f3a">Herontrack</h1>
          </td>
        </tr>
        <!-- Body -->
        <tr>
          <td style="padding:0 32px 32px">
            <h2 style="margin:0 0 8px;font-size:22px;font-weight:600;color:#2a3f3a">Confirm email change</h2>
            <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#5a6e68">
              Click the button below to confirm changing your email address on Herontrack.
            </p>
            <table border="0" cellspacing="0" cellpadding="0">
              <tr>
                <td align="center" style="border-radius:8px" bgcolor="#4a8c7f">
                  <a href="{{ .ConfirmationURL }}" target="_blank" style="display:inline-block;padding:12px 28px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:8px">Confirm email change</a>
                </td>
              </tr>
            </table>
            <p style="margin:24px 0 0;font-size:13px;line-height:1.5;color:#8a9a95">
              If you didn't request this change, please secure your account immediately.
            </p>
          </td>
        </tr>
        <!-- Footer -->
        <tr>
          <td style="padding:20px 32px;border-top:1px solid #e2e8e0;text-align:center">
            <p style="margin:0;font-size:12px;color:#8a9a95">Herontrack — A calm home for your job search</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
